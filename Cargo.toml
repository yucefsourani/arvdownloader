[package]
name = "arvdownloader"
version = "0.1.0"
edition = "2021"
authors = ["Yucef Sourani"]
description = "Cross-platform Video, Reels, Shorts, Playlist & MP3 Downloader built with Rust, GTK4, Libadwaita, and libsoup3"
license = "GPL-3.0-or-later"

[[bin]]
name = "arvdownloader"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
soup = { package = "soup3", version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.5"
once_cell = "1.21"
dunce = "1.0"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = "0.1"
open = "5.4"
